# Disposable PR-only build transport for W1 QA; do not merge to main.
# No secrets, accounts, customer content, external hosting, or deployment.
name: One-shot local-only W1 QA transfer kit

on:
  pull_request:
    paths:
      - '.github/workflows/if-w1-one-shot-transfer.yml'

permissions:
  contents: read

jobs:
  immutable-preview:
    if: startsWith(github.head_ref, 'feat/if-qa-transfer-')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: '2a0145d789241f5dc0737d2d1ffe0068da7eaa5d'
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Verify pinned release identity and build safely
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '2a0145d789241f5dc0737d2d1ffe0068da7eaa5d'
          test "$(git rev-parse HEAD^{tree})" = 'be90cf5402218169e4e16212cde9594036775073'
          test -z "$(git status --porcelain)"
          npm ci
          npm run build
          test -s dist/index.html
          test -s dist/sw.js
          test -s dist/manifest.webmanifest
      - name: Package public source and standalone localhost preview
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stage/dist
          git archive --format=zip --output="stage/interview-facilitator-source-2a0145d789241f5dc0737d2d1ffe0068da7eaa5d.zip" HEAD
          cp -a dist/. stage/dist/
          cat > stage/serve.mjs <<'EOF'
          // W1 disposable QA origin: Node built-ins only, localhost-only, read-only files.
          import { createServer } from 'node:http';
          import { readFile, stat } from 'node:fs/promises';
          import { resolve, sep, extname } from 'node:path';
          import { fileURLToPath } from 'node:url';
          const root = resolve(fileURLToPath(new URL('./dist/', import.meta.url)));
          const types = {
            '.html': 'text/html; charset=utf-8',
            '.js': 'text/javascript; charset=utf-8',
            '.css': 'text/css; charset=utf-8',
            '.svg': 'image/svg+xml',
            '.png': 'image/png',
            '.ico': 'image/x-icon',
            '.webmanifest': 'application/manifest+json',
            '.json': 'application/json',
          };
          const server = createServer(async (request, response) => {
            if (request.method !== 'GET' && request.method !== 'HEAD') {
              response.writeHead(405, { 'Allow': 'GET, HEAD' }).end();
              return;
            }
            let relative;
            try {
              const path = new URL(request.url ?? '/', 'http://127.0.0.1').pathname;
              relative = decodeURIComponent(path);
            } catch {
              response.writeHead(400).end();
              return;
            }
            const target = resolve(root, '.' + (relative === '/' ? '/index.html' : relative));
            if (target !== root && !target.startsWith(root + sep)) {
              response.writeHead(403).end();
              return;
            }
            try {
              if (!(await stat(target)).isFile()) {
                response.writeHead(404).end();
                return;
              }
              const bytes = await readFile(target);
              response.writeHead(200, {
                'Content-Type': types[extname(target).toLowerCase()] ?? 'application/octet-stream',
                'Content-Length': bytes.length,
                'X-Content-Type-Options': 'nosniff',
                'Cache-Control': 'no-store',
              });
              response.end(request.method === 'HEAD' ? undefined : bytes);
            } catch {
              response.writeHead(404).end();
            }
          });
          server.listen(4199, '127.0.0.1', () => {
            console.log('Synthetic local-only Interview Facilitator QA: http://127.0.0.1:4199');
          });
          EOF
          cat > stage/README.txt <<'EOF'
          LDW INTERVIEW FACILITATOR -- SYNTHETIC W1 QA PACKAGE
          -----------------------------------------------------
          Source ref: LowcountryDigitalWorks/interview-facilitator
          Accepted commit: 2a0145d789241f5dc0737d2d1ffe0068da7eaa5d
          Tree: be90cf5402218169e4e16212cde9594036775073
          Built by public GitHub standard hosted Ubuntu runner, Node 24.
          App is local-first schema 1.3, NOT production client deployment or secure sync.

          Requirements: Windows 11, Node.js 24 installed, and Microsoft Edge.
          No npm install or GitHub/Drive access is needed for this PREBUILT preview.

          1. Extract the whole outer workflow artifact ZIP into a NEW QA-only folder.
             Do NOT place real clients' interview data in this test.
          2. From the extracted folder in PowerShell, run:
               node .\serve.mjs
          3. Open in a fresh, disposable browser profile on the SAME device:
               http://127.0.0.1:4199
          4. Use ONLY fictional data. Record build commit, Edge/Windows versions
             and observed S2C-01..10 PASS/FAIL/NOT_RUN case evidence in #5/#37.
             Install from Edge as a real PWA if safe and actually available.
          5. Stop the preview with Ctrl+C. Keep any backup files fictional-only.
             Do not touch existing personal browser profiles or site data.
          
          The bundled server binds ONLY to 127.0.0.1, serves GET/HEAD static
          files from ./dist, has no dependencies/accounts/network API, and
          cannot be reached from a second phone via the LAN. Browser-local
          data persists according to that QA profile's device policies.
          This is NOT an approved HTTPS origin for physical iPhone testing.
          
          Verify files using SHA256SUMS.txt; do not mix components from different
          build revisions. The source ZIP is a public-only Git archive of the
          exact accepted commit, with no .git directory or credentials.
          All real physical acceptance remains NOT_RUN until observed.
          EOF
          node --check stage/serve.mjs
          (cd stage && sha256sum serve.mjs README.txt dist/index.html dist/sw.js dist/manifest.webmanifest "interview-facilitator-source-2a0145d789241f5dc0737d2d1ffe0068da7eaa5d.zip" > SHA256SUMS.txt)
          node stage/serve.mjs > stage/localhost-proof.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for count in $(seq 1 20); do
            if curl --silent --fail http://127.0.0.1:4199/ -o /dev/null; then break; fi
            sleep 1
          done
          curl --silent --fail http://127.0.0.1:4199/sw.js -o /dev/null
          curl --silent --fail http://127.0.0.1:4199/manifest.webmanifest -o /dev/null
          test -s stage/localhost-proof.log
          rm stage/localhost-proof.log
      - name: Upload only synthetic public-source QA kit (7-day artifact)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: if-w1-offline-qa-kit-2a0145d789241f5dc0737d2d1ffe0068da7eaa5d
          path: stage/
          if-no-files-found: error
          retention-days: 7
