name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm install --package-lock-only --ignore-scripts
      - name: Commit bootstrap lockfile
        if: github.event_name == 'pull_request'
        run: |
          if git diff --quiet -- package-lock.json && git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo 'Committed package-lock.json already matches package.json.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore: commit dependency lockfile'
          git push origin HEAD:${{ github.head_ref }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: PWA shell sanity
        run: |
          test -f dist/index.html
          test -f dist/sw.js
          test -f dist/manifest.webmanifest
          test -f dist/icon.svg
          test -f dist/assets/app.js
          test -f dist/assets/app.css
          grep -q 'ldw-interview-facilitator' src/storage.ts
          grep -q 'Saved on this device' src/main.ts
          grep -q 'Share-safe view' src/main.ts
