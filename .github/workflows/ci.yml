name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: PWA shell sanity
        run: |
          test -f dist/index.html
          test -f dist/sw.js
          test -f dist/manifest.webmanifest
          test -f dist/icon.svg
          test -f dist/assets/app.js
          test -f dist/assets/app.css
          grep -q 'ldw-interview-facilitator' src/storage.ts
          grep -q 'Saved on this device' src/indicators.ts
          grep -q 'Share-safe view' src/main.ts
