name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Install Chromium for browser acceptance
        run: npx playwright install --with-deps chromium
      - name: Browser acceptance
        run: npx playwright test
      - name: Controlled update acceptance
        run: npm run test:browser:update
      - name: PWA shell sanity
        run: |
          test ! -f public/sw.js
          test -f dist/index.html
          test -f dist/sw.js
          test -f dist/manifest.webmanifest
          test -f dist/icon.svg
          test -f dist/assets/app.js
          test -f dist/assets/app.css
          grep -q 'ldw-interview-facilitator' src/storage.ts
          grep -q 'Saved on this device' src/indicators.ts
          grep -q 'Presentation view' src/main.ts
          grep -q 'interview-facilitator-shell-' dist/sw.js
          grep -q 'GET_RELEASE' dist/sw.js
          grep -q 'SKIP_WAITING' dist/sw.js
          grep -q '?release=' dist/sw.js
          grep -q "cache: 'reload'" dist/sw.js
          grep -q "updateViaCache: 'none'" src/pwa.ts
          node scripts/check-generated-sw.mjs
