name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Install Chromium for browser acceptance
        run: npx playwright install --with-deps chromium
      - name: Browser acceptance
        run: npx playwright test
      - name: PWA shell sanity
        run: |
          test -f dist/index.html
          test -f dist/sw.js
          test -f dist/manifest.webmanifest
          test -f dist/icon.svg
          test -f dist/assets/app.js
          test -f dist/assets/app.css
          grep -q 'ldw-interview-facilitator' src/storage.ts
          grep -q 'Saved on this device' src/indicators.ts
          grep -q 'Presentation view' src/main.ts
          grep -q 'interview-facilitator-shell-v2' public/sw.js
          grep -q "key.startsWith(CACHE_PREFIX) && key !== CACHE" public/sw.js
          grep -q "new Request(request, { cache: 'no-cache' })" public/sw.js
          grep -q 'const response = await fetch(networkRequest)' public/sw.js
          grep -q 'cache.match(url.pathname)' public/sw.js
