name: Synthetic WebKit compatibility smoke

on:
  pull_request:
    paths:
      - '.github/workflows/synthetic-webkit-smoke.yml'
      - 'playwright.webkit-smoke.config.ts'
      - 'tests/browser/webkit-compat-smoke.pw.ts'
      - 'docs/WEBKIT_SYNTHETIC_ACCEPTANCE.md'

permissions:
  contents: read

jobs:
  webkit-synthetic:
    if: startsWith(github.head_ref, 'feat/if-webkit-synthetic-smoke-')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Install Playwright WebKit browser and system dependencies
        run: npx playwright install --with-deps webkit
      - name: Run only synthetic WebKit compatibility cases
        run: npx playwright test -c playwright.webkit-smoke.config.ts
